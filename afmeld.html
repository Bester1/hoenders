<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afmeld — Plaas Hoenders</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
               background: #fafaf9; color: #27272a;
               font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
        .card { background: #fff; border: 1px solid #e7e5e4; border-radius: 14px;
                padding: 32px; max-width: 460px; width: calc(100% - 32px);
                box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        h1 { font-size: 20px; margin: 0 0 6px; }
        .sub { color: #78716c; font-size: 14px; margin: 0 0 20px; }
        .addr { font-weight: 600; word-break: break-all; }
        button { width: 100%; padding: 12px; border: 0; border-radius: 9px;
                 background: #ea580c; color: #fff; font: inherit; font-weight: 600;
                 cursor: pointer; }
        button:disabled { background: #d6d3d1; cursor: default; }
        .msg { margin-top: 16px; font-size: 14px; }
        .ok { color: #15803d; } .err { color: #b91c1c; }
        .foot { margin-top: 22px; font-size: 13px; color: #78716c; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐔 Plaas Hoenders</h1>
        <p class="sub">Van die bestellys afkom</p>
        <div id="content">Laai...</div>
        <p class="foot">
            Jy sal steeds 'n bevestiging en 'n faktuur kry vir enige bestelling
            wat jy self plaas. Net die kennisgewing dat 'n nuwe rondte oop is,
            stop — so jy sal self moet onthou om te bestel.
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Deliberately standalone: this page must work even if the rest of the
        // app is broken, because a person who wants off the list has to be able
        // to get off the list.
        const SUPABASE_URL = 'https://ukdmlzuxgnjucwidsygj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrZG1senV4Z25qdWN3aWRzeWdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTMzOTAyNDcsImV4cCI6MjA2ODk2NjI0N30.sMTJlWST6YvV--ZJaAc8x9WYz_m9c-CPpBlNvuiBw3w';

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const params = new URLSearchParams(location.search);
        const email = (params.get('e') || '').trim().toLowerCase();
        const content = document.getElementById('content');

        function show(html) { content.innerHTML = html; }

        if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
            show('<p class="msg err">Hierdie skakel is nie geldig nie. ' +
                 'Antwoord gerus net op die e-pos en ek haal jou met die hand af.</p>');
        } else {
            show(`<p>Haal <span class="addr">${email.replace(/[<>&]/g, '')}</span> ` +
                 `van die bestellys af?</p>` +
                 `<p class="sub">Jy sal dan nie weer hoor wanneer daar 'n nuwe ` +
                 `rondte oop is nie.</p>` +
                 `<button id="go">Ja, meld my af</button><div class="msg" id="msg"></div>`);

            document.getElementById('go').addEventListener('click', async () => {
                const btn = document.getElementById('go');
                const msg = document.getElementById('msg');
                btn.disabled = true;
                btn.textContent = 'Besig...';
                // Insert, ignoring a duplicate, rather than upserting. An upsert
                // needs UPDATE permission on the table, and an UPDATE policy wide
                // enough to allow it also lets anyone rewrite somebody else's row
                // — changing the address on an opt-out puts that person back on
                // the list. Opt-out rows are immutable by design: the only public
                // operations are "add mine" and "read the list".
                //
                // A duplicate is not an error here. Someone clicking the link a
                // second time is still opted out, which is the outcome they want.
                const { error } = await client.from('notification_optouts')
                    .insert({ email }, { count: 'exact' });
                if (error && error.code !== '23505') {
                    btn.disabled = false;
                    btn.textContent = 'Probeer weer';
                    msg.className = 'msg err';
                    msg.textContent = 'Kon dit nie stoor nie. Antwoord asseblief op die ' +
                        'e-pos en ek haal jou met die hand af.';
                    return;
                }
                btn.remove();
                msg.className = 'msg ok';
                msg.textContent = "Klaar. Jy sal nie weer die kennisgewing kry wanneer " +
                    "'n nuwe rondte oop is nie. Antwoord enige tyd op een van " +
                    "die ou e-posse as jy weer op die lys wil wees.";
            });
        }
    </script>
</body>
</html>
