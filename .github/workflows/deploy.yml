name: Secure Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        # Install any dependencies if needed
        npm install || echo "No package.json found, skipping npm install"
    
    - name: Security Scan - Check for hardcoded credentials
      run: |
        echo "🔍 Scanning for hardcoded credentials..."
        
        # Check for common hardcoded credential patterns
        if grep -r "supabase\.co" . --include="*.js" --include="*.html" --exclude="env-config.js" --exclude-dir=".git" | grep -v "window\.ENV" | grep -v "process\.env" | grep -v "your-project"; then
          echo "❌ Found potential hardcoded Supabase credentials"
          exit 1
        fi
        
        if grep -r "AKfycbz" . --include="*.js" --include="*.html" --exclude="env-config.js" --exclude-dir=".git" | grep -v "window\.ENV" | grep -v "your-script-id"; then
          echo "❌ Found potential hardcoded Google Script URL"
          exit 1
        fi
        
        if grep -r "eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*" . --include="*.js" --include="*.html" --exclude="env-config.js" --exclude-dir=".git" | grep -v "window\.ENV" | grep -v "your-anon-key"; then
          echo "❌ Found potential hardcoded JWT tokens"
          exit 1
        fi
        
        echo "✅ No hardcoded credentials found in source files"
    
    - name: Validate required secrets
      run: |
        echo "🔐 Validating required secrets..."
        
        # Check that required secrets are set
        if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
          echo "❌ SUPABASE_URL secret is not configured"
          echo "Please add SUPABASE_URL to your GitHub repository secrets"
          exit 1
        fi
        
        if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
          echo "❌ SUPABASE_ANON_KEY secret is not configured"
          echo "Please add SUPABASE_ANON_KEY to your GitHub repository secrets"
          exit 1
        fi
        
        if [ -z "${{ secrets.GOOGLE_SCRIPT_URL }}" ]; then
          echo "❌ GOOGLE_SCRIPT_URL secret is not configured"
          echo "Please add GOOGLE_SCRIPT_URL to your GitHub repository secrets"
          exit 1
        fi
        
        echo "✅ All required secrets are configured"
    
    - name: Create secure environment configuration
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
      run: |
        echo "🔧 Creating secure environment configuration..."
        bash create-env-config.sh
        echo "✅ Environment configuration created"
    
    - name: Validate HTML files
      run: |
        echo "🔍 Validating HTML files..."
        
        # Check that required script tags are present
        if ! grep -q "env-config.js" index.html; then
          echo "❌ index.html missing env-config.js script tag"
          exit 1
        fi
        
        if ! grep -q "config.js" index.html; then
          echo "❌ index.html missing config.js script tag"
          exit 1
        fi
        
        if ! grep -q "security-utils.js" index.html; then
          echo "❌ index.html missing security-utils.js script tag"
          exit 1
        fi
        
        if ! grep -q "error-handler.js" index.html; then
          echo "❌ index.html missing error-handler.js script tag"
          exit 1
        fi
        
        echo "✅ HTML files contain required security script tags"
    
    - name: Create security headers file
      run: |
        echo "🛡️ Creating security headers configuration..."
        printf '/*\n  X-Frame-Options: DENY\n  X-Content-Type-Options: nosniff\n  X-XSS-Protection: 1; mode=block\n  Referrer-Policy: strict-origin-when-cross-origin\n  Permissions-Policy: geolocation=(), microphone=(), camera=()\n  Content-Security-Policy: default-src '\''self'\''; script-src '\''self'\'' '\''unsafe-inline'\'' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src '\''self'\'' '\''unsafe-inline'\'' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://unpkg.com; font-src '\''self'\'' https://cdnjs.cloudflare.com https://fonts.gstatic.com https://unpkg.com; img-src '\''self'\'' data: https:; connect-src '\''self'\'' https://*.supabase.co https://script.google.com; frame-src '\''none'\''; object-src '\''none'\''; base-uri '\''self'\''; form-action '\''self'\'';\n  Strict-Transport-Security: max-age=31536000; includeSubDomains; preload\n' > _headers
        echo "✅ Security headers configured"
    
    - name: Create security policy file
      run: |
        echo "📋 Creating security policy documentation..."
        printf '# Security Policy\n\n## Reporting Security Vulnerabilities\n\nIf you discover a security vulnerability, please DO NOT open a public issue. Instead, contact us privately with detailed information about the vulnerability.\n\n## Security Measures Implemented\n\n- ✅ Environment-based configuration (no hardcoded credentials)\n- ✅ Input validation and sanitization\n- ✅ XSS protection\n- ✅ SQL injection prevention\n- ✅ CSRF protection\n- ✅ Rate limiting\n- ✅ Security headers\n- ✅ HTTPS enforcement\n- ✅ Content Security Policy\n\n## Dependencies\n\nThis application uses third-party services:\n- Supabase (Database)\n- Google Apps Script (Email service)\n\n## Deployment Security\n\nThis application is deployed using GitHub Actions with:\n- Encrypted secrets management\n- Automated security scanning\n- Security header configuration\n- HTTPS enforcement\n\nBuild: ${{ github.run_number }}\nCommit: ${{ github.sha }}\nDeployed: ${{ github.event.head_commit.timestamp }}\n' > SECURITY.md
    
    - name: Build integrity check
      run: |
        echo "🔍 Performing build integrity check..."
        
        # List files that will be deployed
        echo "Files to be deployed:"
        ls -la
        
        # Check that critical files exist
        required_files=("env-config.js" "config.js" "security-utils.js" "error-handler.js" "index.html" "script.js" "customer.js")
        
        for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
                echo "❌ Missing required file: $file"
                exit 1
            fi
        done
        
        echo "✅ All required files present"
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
    
    - name: Post-deployment verification
      run: |
        echo "🚀 Deployment completed!"
        echo "Application URL: ${{ steps.deployment.outputs.page_url }}"
        echo ""
        echo "✅ Security deployment completed successfully!"
        echo ""
        echo "Next steps:"
        echo "1. Test the application functionality"
        echo "2. Verify security measures are working"
        echo "3. Monitor for any security issues"
        echo "4. Set up automated security monitoring"